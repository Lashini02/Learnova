services:
  - type: web
    name: learnova-backend
    env: python
    plan: starter
    branch: main
    # Use explicit cd to ensure commands run in the backend folder
    buildCommand: cd learnova_fullstack/backend && pip install -r requirements.txt
    startCommand: cd learnova_fullstack/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT}
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./learnova.db
      - key: SECRET_KEY
        value: change-me-change-this-to-a-secret
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CARGO_HOME
        value: /tmp/.cargo
      - key: RUSTUP_HOME
        value: /tmp/.rustup
    disk:
      size_gb: 1
      mount_path: /data
